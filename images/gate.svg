<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><title>The proposed system checks visibility, then temporal fault evidence, before giving a grounded correction or asking for a new view.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#72817e"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#193531"><rect x="30" y="80" width="185" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="46" y="109" font-size="17" font-weight="bold">Pose + visibility</text><text x="46" y="134" font-size="13">Are the needed joints visible?</text><path d="M224 125L278 125" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="80" width="240" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="306" y="109" font-size="17" font-weight="bold">Temporal fault evidence</text><text x="306" y="134" font-size="13">Persistent, supported deviation?</text><path d="M540 125L602 125" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><rect x="615" y="80" width="250" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="631" y="109" font-size="17" font-weight="bold">Grounded coaching</text><text x="631" y="134" font-size="13">One supported correction</text><path d="M125 176V220H540" stroke="#b64d30" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M410 176V220" stroke="#b64d30" stroke-width="2" fill="none"/><rect x="550" y="190" width="315" height="90" fill="#f6e8df" stroke="#c8d5cd"/><text x="566" y="219" font-size="17" font-weight="bold">Insufficient evidence</text><text x="566" y="244" font-size="13">Request a new view or another repetition</text><text x="30" y="40" font-size="16" font-weight="bold">PROJECT 2 · PROPOSED EVIDENCE GATE</text><text x="141" y="213" font-size="13">Low visibility / uncertain fault</text></g></svg>