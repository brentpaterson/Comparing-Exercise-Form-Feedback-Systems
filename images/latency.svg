<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img"><title>Feedback delay includes temporal buffering, model processing, networking, and output; frames per second is not total delay.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#72817e"/></marker></defs><rect width="900" height="260" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#193531"><text x="30" y="40" font-size="16" font-weight="bold">WHERE DOES THE TIME GO?</text><rect x="30" y="78" width="155" height="75" fill="#ffffff" stroke="#c8d5cd"/><text x="46" y="107" font-size="17" font-weight="bold">Observe</text><text x="46" y="132" font-size="13">Temporal context</text><rect x="205" y="78" width="155" height="75" fill="#ffffff" stroke="#c8d5cd"/><text x="221" y="107" font-size="17" font-weight="bold">Analyze</text><text x="221" y="132" font-size="13">Pose + detector</text><rect x="380" y="78" width="155" height="75" fill="#ffffff" stroke="#c8d5cd"/><text x="396" y="107" font-size="17" font-weight="bold">Connect</text><text x="396" y="132" font-size="13">Network round trip</text><rect x="555" y="78" width="155" height="75" fill="#ffffff" stroke="#c8d5cd"/><text x="571" y="107" font-size="17" font-weight="bold">Generate</text><text x="571" y="132" font-size="13">Coaching response</text><rect x="730" y="78" width="155" height="75" fill="#ffffff" stroke="#c8d5cd"/><text x="746" y="107" font-size="17" font-weight="bold">Deliver</text><text x="746" y="132" font-size="13">Display + audio</text><path d="M187 116L201 116" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><path d="M362 116L376 116" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><path d="M537 116L551 116" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><path d="M712 116L726 116" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="208" font-size="16">Measure from the relevant captured event to the visible or audible correction.</text></g></svg>