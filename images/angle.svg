<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"><title>A joint angle is computed from two vectors meeting at a joint; projected angles depend on camera position.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#72817e"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#193531"><path d="M100 80L260 200L395 83" fill="none" stroke="#193531" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="80" r="9" fill="#b64d30"/><circle cx="260" cy="200" r="9" fill="#b64d30"/><circle cx="395" cy="83" r="9" fill="#b64d30"/><path d="M214 165Q260 118 306 160" fill="none" stroke="#b64d30" stroke-width="3"/><text x="83" y="53" font-size="18">Hip (H)</text><text x="218" y="240" font-size="18">Knee (K)</text><text x="347" y="53" font-size="18">Ankle (A)</text><text x="251" y="148" font-size="22">θ</text><rect x="470" y="75" width="385" height="100" fill="#ffffff" stroke="#c8d5cd"/><text x="486" y="104" font-size="17" font-weight="bold">u = H − K     v = A − K</text><text x="486" y="129" font-size="13">θ = arccos((u · v) / (‖u‖ ‖v‖))</text><text x="473" y="211" font-size="14">Illustrative unsigned angle: 0° to 180°.</text><text x="473" y="236" font-size="14">A 2D projection is not a camera-invariant 3D angle.</text></g></svg>