<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img"><title>An angle histogram keeps the most frequent bin and loses the order of frames.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#72817e"/></marker></defs><rect width="900" height="290" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#193531"><text x="30" y="38" font-size="16" font-weight="bold">HOLD-PHASE FEATURE · ILLUSTRATIVE COUNTS</text><path d="M70 65V225H460" stroke="#72817e" fill="none"/><rect x="95" y="213" width="35" height="12" fill="#7ba393"/><rect x="147" y="197" width="35" height="28" fill="#7ba393"/><rect x="199" y="160" width="35" height="65" fill="#7ba393"/><rect x="251" y="83" width="35" height="142" fill="#b64d30"/><rect x="303" y="147" width="35" height="78" fill="#7ba393"/><rect x="355" y="195" width="35" height="30" fill="#7ba393"/><rect x="407" y="213" width="35" height="12" fill="#7ba393"/><text x="72" y="255" font-size="13">Angle bins →</text><path d="M485 146L543 146" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><rect x="565" y="96" width="280" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="581" y="125" font-size="17" font-weight="bold">Dominant-angle feature</text><text x="581" y="150" font-size="13">Center of the most populated bin</text><text x="560" y="226" font-size="14">Compact summary; temporal order is discarded.</text></g></svg>