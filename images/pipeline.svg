<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img"><title>Five distinct tasks: video, pose, repetition, fault evidence, and coaching.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#72817e"/></marker></defs><rect width="900" height="280" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#193531"><text x="30" y="40" font-size="13" letter-spacing="2">FROM PIXELS TO A USEFUL CORRECTION</text><rect x="30" y="83" width="155" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="46" y="112" font-size="17" font-weight="bold">Video</text><text x="46" y="137" font-size="13">RGB camera</text><rect x="205" y="83" width="155" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="221" y="112" font-size="17" font-weight="bold">Pose</text><text x="221" y="137" font-size="13">Joint positions</text><rect x="380" y="83" width="155" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="396" y="112" font-size="17" font-weight="bold">Movement</text><text x="396" y="137" font-size="13">Phase + repetitions</text><rect x="555" y="83" width="155" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="571" y="112" font-size="17" font-weight="bold">Fault evidence</text><text x="571" y="137" font-size="13">Error + confidence</text><rect x="730" y="83" width="155" height="90" fill="#ffffff" stroke="#c8d5cd"/><text x="746" y="112" font-size="17" font-weight="bold">Coaching</text><text x="746" y="137" font-size="13">Supported correction</text><path d="M187 128L201 128" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><path d="M362 128L376 128" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><path d="M537 128L551 128" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><path d="M712 128L726 128" fill="none" stroke="#72817e" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="223" font-size="16">A successful earlier stage does not prove a successful later stage.</text></g></svg>