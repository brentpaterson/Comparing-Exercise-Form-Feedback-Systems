<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"><title>A squat moves through descent, bottom, and ascent; a stable hold can instead be summarized by an angle histogram.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#72817e"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#193531"><text x="34" y="38" font-size="16" font-weight="bold">DYNAMIC SQUAT · ILLUSTRATIVE KNEE ANGLE</text><path d="M70 72V231H850" stroke="#72817e" stroke-width="2" fill="none"/><path d="M80 90C220 92 270 211 420 211S650 93 830 90" fill="none" stroke="#193531" stroke-width="4"/><path d="M350 70V230M490 70V230" stroke="#b64d30" stroke-dasharray="5"/><text x="152" y="265" font-size="16">Descent</text><text x="370" y="265" font-size="16">Bottom</text><text x="635" y="265" font-size="16">Ascent</text><text x="20" y="102" font-size="13">High</text><text x="23" y="212" font-size="13">Low</text><text x="727" y="211" font-size="13">Time →</text></g></svg>